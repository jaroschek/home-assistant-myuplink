rules:
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: The integration has no separate API dependency; its client is included in this repository.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration does not define custom conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not define custom triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: CI requires above 95% statement and branch coverage in every integration module and 100% config-flow coverage.
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Devices are available through an authenticated cloud account and cannot be discovered locally.
  discovery-update-info:
    status: exempt
    comment: The cloud API does not use device network addresses.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: Authentication repairs are handled by Home Assistant's reauthentication flow; no other persistent repair condition is currently identified.
  stale-devices:
    status: done
    comment: Cloud absence is not confirmation of permanent removal. Missing entities become unavailable, and the device-removal hook allows explicit cleanup of absent devices or unloaded accounts.
  async-dependency:
    status: exempt
    comment: There is no separate API dependency; the included client uses asynchronous aiohttp requests.
  inject-websession: done
  strict-typing:
    status: done
    comment: Strict mypy covers the included API client, typed response models, coordinator runtime_data, and every platform.
