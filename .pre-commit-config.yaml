repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uv run --no-sync ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --no-sync ruff format --check
        language: system
        types_or: [python, pyi]

